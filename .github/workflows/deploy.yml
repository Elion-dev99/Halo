# Deploy to GitHub Pages (optional / legacy)
#
# Requires repository secrets VITE_FIREBASE_* — see docs/secrets-setup.md
# Prefer Cloudflare Workers & Pages for preview without a custom domain.
#
# Default: manual only so missing secrets do not fail every push.

name: Deploy Vite to GitHub Pages

on:
  workflow_dispatch:
  # Uncomment after VITE_FIREBASE_* secrets are configured:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          HAS_FB_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          HAS_FB_PROJECT: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          missing=0
          if [ -z "$HAS_FB_KEY" ]; then echo "::error::Missing secret VITE_FIREBASE_API_KEY"; missing=1; fi
          if [ -z "$HAS_FB_PROJECT" ]; then echo "::error::Missing secret VITE_FIREBASE_PROJECT_ID"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "See docs/secrets-setup.md"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          VITE_BASE_PATH: /Halo/
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
